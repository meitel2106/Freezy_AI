name: Autonomous World Simulator

on:
  # 毎時0分に自動実行（1時間おきに強制発動）
  schedule:
    - cron: '0 * * * *'
  # GitHubの画面から手動でテスト実行するための神ボタン
  workflow_dispatch:

jobs:
  simulate-world:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          cd freezyai-simulator
          pip install -r requirements.txt

      - name: Firebase認証ファイルの作成
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > freezyai-simulator/firebase_credentials.json

      - name: シミュレーターの実行（神の演算開始）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd freezyai-simulator
          python simulator.py
