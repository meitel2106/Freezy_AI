name: Autonomous World Simulator

on:
  # 毎時0分に自動実行（1時間おきに強制発動）
  schedule:
    - cron: '0 * * * *'
  # GitHubの画面から手動でテスト実行するための神ボタン
  workflow_dispatch:

jobs:
  simulate-world:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai firebase-admin

      - name: シミュレーターの実行（神の演算開始）
        env:
          # GitHub Secretsから安全に鍵を読み込む設定
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          python simulator.py
