name: World Simulator Cron

on:
  schedule:
    cron: '7,37 * * * *' # 30分ごと（00分の混雑を回避）
  workflow_dispatch: # いつでも手動で実行できるボタンを表示

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: コードの読み込み
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要な魔法（ライブラリ）のインストール
        run: |
          python -m pip install --upgrade pip
          cd freezyai-simulator
          # requirements.txt があればそれを使ってインストール、念のため直接指定もしておくわ
          pip install -r requirements.txt || true
          pip install "firebase-admin>=6.5.0" "google-generativeai>=0.5.0"

      - name: 🌍 シミュレーターの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          cd freezyai-simulator
          python simulator.py
